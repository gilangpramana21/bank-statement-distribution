version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bank_statements_db
    environment:
      POSTGRES_DB: bank_statements
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bank Statement Distribution Application
  app:
    build: .
    container_name: bank_statements_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - ENVIRONMENT=production
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./credentials:/app/credentials
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    command: python main.py run

  # Scheduler Service
  scheduler:
    build: .
    container_name: bank_statements_scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - ENVIRONMENT=production
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./credentials:/app/credentials
      - ./logs:/app/logs
    command: python -m src.scheduler

  # Health Check Service
  health:
    build: .
    container_name: bank_statements_health
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - ENVIRONMENT=production
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./credentials:/app/credentials
    ports:
      - "8080:8080"
    command: python -m src.health_check

volumes:
  postgres_data:
